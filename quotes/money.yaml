- text: The most important quality for an investor is temperament, not intellect.
  author: Warren Buffett
  tags: [investing, temperament]

- text: The most brilliant financial strategy consists of living well within one’s means.
  author: Benjamin Graham
  tags: [living below means]

- text: |
    Money is more like a vaccine than a performance-enhancing drug.
    It can prevent a lot of misery, but it won’t necessarily make you happier.
  author: Derek Thompson
  tags: [happiness]

- text: Patience is a virtue. Virtues are no fun. Train yourself to be patient and you'll never need to worry about having a lot of competition.
  author: Jason Zweig
  tags: [patience, virtue]

- text: A lot of people with high IQs are terrible investors because they’ve got terrible temperaments.
  author: Charlie Munger
  tags: [investing, temperament]

- text: In my investing career, the best gains usually have come in the third or fourth year, not in the third or fourth week or the third or fourth month.
  author: Peter Lynch
  tags: [investing, holding]

- text: It’s not the things you buy and sell that make you money; it’s the things you hold.
  author: Howard Marks
  tags: [investing, holding]

- text: |
    Cash, though, is to a business as oxygen is to an individual:
    never thought about when it is present, the only thing in mind when it is absent.
  author: Warren Buffett
  tags: [emergency fund]

- text: It’s very hard to go bankrupt when you don’t have any debt.
  author: Peter Lynch
  tags: [0 debt]

- text: Any fool can make a fortune. It takes a man of brains to hold onto it after it is made.
  author: Cornelius Vanderbilt
  tags: [stay rich]

- text: The big money is not in buying or selling, but in the waiting.
  author: Charlie Munger
  tags: [investing, holding]

- text: Diversification may preserve wealth, but concentration builds wealth.
  author: Warren Buffett
  tags: [diversification]

- text: Risk comes from not knowing what you are doing.
  author: Warren Buffett
  tags: [investing, risk]

- text: |
    When any guy offers you a chance to earn lots of money without risk, don’t listen to the rest of his sentence.
    Follow this, and you’ll save yourself a lot of misery.
  author: Charlie Munger
  tags: [quick money]

- text: |
    Asking what the biggest risks are is like asking what you expect to be surprised about.
    If you knew what the biggest risk was you would do something about it, and doing something about it makes it less risky.
  author: Morgan Housel
  tags: [risk]

- text: |
    The best investment against inflation is to improve your own earning power, your own talent.
    Very few people maximize their talent.
    If you increase your talent, they can’t tax it or they can’t take it away from you.
  author: Warren Buffett
  tags: [inflation, self-investment]

- text: |
    People calculate too much and think too little.
    Thinking is a surprisingly underrated activity in investing.
    People who cannot be alone with their own thoughts for a long time are terrible candidates to become successful investors.
  author: Charlie Munger
  tags: [investing, thinking]

- text: |
    You can’t do well investing unless you think independently.
    And the truth is, you are neither right nor wrong because people agree with you.
    You’re right because your facts and reasoning are right.
    In the end, that’s what counts.
  author: Warren Buffett
  tags: [investing, independent thinking]

- text: Happiness is not in the mere possession of money; it lies in the joy of achievement, in the thrill of creative effort.
  author: Franklin D. Roosevelt
  tags: [happiness]

- text: It is impossible to produce superior performance unless you do something different from the majority.
  author: John Templeton
  tags: [investing, independent thinking]
