- text: The most important quality for an investor is temperament, not intellect.
  author: Warren Buffett
  tags: [investing, temperament]

- text: The most brilliant financial strategy consists of living well within one’s means.
  author: Benjamin Graham

- text: |
    Money is more like a vaccine than a performance-enhancing drug.
    It can prevent a lot of misery, but it won’t necessarily make you happier.
  author: Derek Thompson
  tags: [happiness]

- text: Patience is a virtue. Virtues are no fun. Train yourself to be patient and you'll never need to worry about having a lot of competition.
  author: Jason Zweig
  tags: [patience]

- text: A lot of people with high IQs are terrible investors because they’ve got terrible temperaments.
  author: Charlie Munger
  tags: [investing, temperament]
