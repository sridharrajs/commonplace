# One file per category: the file name is the category (work.yaml → "Work").
# Each quote needs `text`; `author`, `source` and `tags` are optional.
# Use `text: |` for multi-line quotes to keep the line breaks.

- text: The secret of getting ahead is getting started.
  author: Mark Twain
  tags: [starting]

- text: |
        Be curious. Read widely. Try new things.
        What people call intelligence just boils down to curiosity.
  author: Aaron Swartz
  tags: [curiosity]

- text: |
    In my whole life, I have known no wise people who didn’t read all the time - none, zero.
    You’d be amazed at how much Warren reads - at how much I read.
    They think I’m a book with a couple of legs sticking out.
  author: Charlie Munger
  tags: [reading]

- text: The man who does not read good books has no advantage over the man who can’t read them.
  author: Mark Twain
  tags: [reading]

- text: Reading is to the mind what exercise is to the body.
  author: Joseph Addison
  tags: [reading]

- text: The most powerful person in the world is the storyteller.
  author: Steve Jobs
  tags: [storytelling]

- text: You need a story to displace a story.
  author: Nassim Nicholas Taleb
  tags: [storytelling]

- text: |
    The best arguments in the world won’t change a single person’s mind.
    The only thing that can do that is a good story.
  author: Morgan Housel
  tags: [storytelling]

- text: In the fields of observation chance favours only the prepared mind.
  author: Louis Pasteur
  tags: [preparedness]

- text: Invest in preparedness, not in prediction.
  author: Nassim Nicholas Taleb
  tags: [preparedness]

- text: In preparing for battle I have always found that plans are useless but planning is indispensable.
  author: Dwight D. Eisenhower
  tags: [preparedness]

- text: The beginning is the most important part of the work.
  author: Plato
  tags: [starting]

- text: Never leave that till tomorrow which you can do today.
  author: Benjamin Franklin
  tags: [procrastination]

- text: |
    You should have a bias to action.
    You have 100 decisions a day, but no definitive answers on any of them,
    if you sit and analyze the world will pass you by.
    A good plan executed now is better than a great plan executed later.
  author: Marc Andreessen
  tags: [action]

- text: If you can’t measure it, you can’t improve it.
  author: Peter Drucker
  tags: [productivity]

- text: Wanting more information is often just a form of procrastination.
  author: Russ Roberts
  tags: [procrastination]

- text: Any idea, plan, or purpose may be placed in the mind through repetition of thought.
  author: Napoleon Hill
  tags: [repetition]

- text: However beautiful the strategy, you should occasionally look at the results.
  author: Winston Churchill
  tags: [strategy]

- text: The universe is made of stories, not of atoms.
  author: Muriel Rukeyser
  tags: [storytelling]

- text: A good advertisement is one that sells the product without drawing attention to itself.
  author: David Ogilvy
  tags: [advertising]

- text: We make advertisements that people want to read. You can’t save souls in an empty church.
  author: David Ogilvy
  tags: [advertising]

- text: A goal without a plan is only a wish.
  author: Antoine de Saint-Exupéry
  tags: [planning]

- text: A good plan violently executed right now is far better than a perfect plan executed next week.
  author: George S. Patton
  tags: [planning]

- text: It does not matter how slowly you go as long as you do not stop.
  author: Confucius
  tags: [persistence]

- text: |
    The best time to plant a tree was 20 years ago.
    The second best time is today.
  author: Chinese Proverb
  tags: [starting]

- text: A year from now you will wish you had started today.
  author: Karen Lamb
  tags: [starting]

- text: When I am traveling in a carriage or walking after a good meal or during the night when I cannot sleep–it is on such occasions that my ideas flow best and most abundantly.
  author: Wolfgang Amadeus Mozart
  tags: [creativity]

- text: We are what we repeatedly do. Excellence, then, is not an act, but a habit.
  author: Aristotle
  tags: [habits]

- text: The key is not the will to win. Everyone has that. It is the will to prepare to win that is important.
  author: Bobby Knight
  tags: [preparedness]

- text: He who sweats more in training bleeds less in battle.
  author: George S. Patton
  tags: [preparedness]

- text: |
    This is the real secret of life — to be completely engaged with what you are doing in the here and now.
    And instead of calling it work, realize it is play.
  author: Alan Watts
  tags: [be present]

- text: |
    A customer is the most important visitor on our premises.
    He is not dependent on us. We are dependent on him.
    He is not an interruption of our work. He is the purpose of it.
    He is not an outsider of our business. He is part of it.
    We are not doing him a favour by serving him.
    He is doing us a favour by giving us an opportunity to do so.
  author: Mahatma Gandhi
  tags: [customers]

- text: |
    Develop into a lifelong self-learner through voracious reading;
    cultivate curiosity and strive to become a little wiser every day.
  author: Charlie Munger
  tags: [learning, reading, curiosity]

- text: |
    Spend each day trying to be a little wiser than you were when you woke up.
    Day by day, and at the end of the day - if you live long enough - like most people,
    you will get out of life what you deserve.
  author: Charlie Munger
  tags: [learning, wisdom]

- text: |
    I constantly see people rise in life who are not the smartest, but they are learning machines.
    They go to bed every night a little wiser than they were when they got up and boy does that help, particularly when you have a long run ahead of you.
  author: Charlie Munger
  tags: [learning, wisdom]

- text: |
    Read 500 pages every day. That’s how knowledge works.
    It builds up, like compound interest.
    All of you can do it, but I guarantee not many of you will do it.
  author: Warren Buffett
  tags: [reading, learning]

- text: If [more] information was the answer, then we’d all be billionaires with perfect abs.
  author: Derek Sivers
  tags: [productivity, procrastination]

- text: |
    Lucky opportunities tend to be stumbled upon, not handed out.
    Opportunity comes to the prepared mind.
  author: Charlie Munger
  tags: [preparedness, luck]

- text: |
    Anyone who stops learning is old, whether at twenty or eighty.
    Anyone who keeps learning stays young.
    The greatest thing in life is to keep your mind young.
  author: Henry Ford
  tags: [learning]

- text: An investment in knowledge pays the best interest.
  author: Benjamin Franklin
  tags: [learning, self-investment]

- text: You don’t have to be brilliant, only a little bit wiser than the other guys, on average, for a long, long time.
  author: Charlie Munger
  tags: [wisdom, long-term]

- text: You should keep learning… to the end of your life.
  author: Seneca
  tags: [learning]

- text: |
    The single most important thing, if you want to avoid a lot of stupid errors, is knowing where you’re competent and where you aren’t.
    Knowing the edge of your own competency.
    And that’s very hard to do because the human mind naturally tries to make you think you’re way smarter than you are.
  author: Charlie Munger
  tags: [circle of competence, wisdom]

- text: |
    A lot of smart people think they’re way smarter than they are, and therefore they do worse than dumb people.
    And it’s very common to be utterly brilliant and think you’re way the hell smarter than you are.
  author: Charlie Munger
  tags: [circle of competence, self-awareness]

- text: The enemy of art is the absence of limitations.
  author: Orson Welles
  tags: [creativity, constraints]

- text: Anybody who doesn’t change their mind a lot is dramatically underestimating the complexity of the world we live in.
  author: Jeff Bezos
  tags: [thinking, uncertainty]

- text: You don’t need mentors, you need action.
  author: Naval Ravikant
  tags: [action]

- text: I think that one should recognize the reality even when one doesn’t like it; indeed, especially when one doesn’t like it.
  author: Charlie Munger
  tags: [self-awareness, delusion]

- text: You must force yourself to consider opposing arguments. Especially when they challenge your best-loved ideas.
  author: Charlie Munger
  tags: [thinking, independent thinking]

- text: Reading is faster than listening, doing is faster than watching.
  author: Naval Ravikant
  tags: [learning, reading, action]

- text: The best thing a human being can do is to help another human being know more.
  author: Charlie Munger
  tags: [learning, teaching]
